[project]
name = "alpha-portfolio-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests", "scripts"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# pycodestyle (PEP 8), Pyflakes, isort, flake8-bugbear, pyupgrade, flake8-simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is the formatter's job; long comments and strings are left alone

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as call defaults; `require(permission)` builds one
extend-immutable-calls = ["app.deps.require", "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Path", "fastapi.Body", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # a pytest fixture imported from another test module is redefined by its use as an argument
