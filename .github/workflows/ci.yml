# The checks in CODING_STANDARDS.md, on every push and pull request.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
        env:
          SKIP_MERMAID_TESTS: "1"  # the frontend job renders Mermaid in its architecture document check

  frontend:
    name: Frontend (eslint, prettier, tsc, build) and architecture document
    runs-on: ubuntu-latest
    timeout-minutes: 20  # the first mermaid-cli run downloads headless Chromium
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3  # the API types are generated from the backend's OpenAPI schema
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api  # src/api/schema.d.ts is generated, not committed
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vite build
      - name: Architecture document check (sections, links, Mermaid, generated regions)
        run: uv run python -m scripts.architecture_doc check  # Node is here for mermaid-cli
        working-directory: .

  pre-commit:
    name: Repo hygiene (pre-commit-hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format,mypy,prettier,eslint,tsc  # the jobs above run these against the locked versions
